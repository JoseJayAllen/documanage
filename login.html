<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OQAADMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <style>
    .pending-alert { background: linear-gradient(135deg, #f6c23e 0%, #dda20a 100%); color: white; border: none; }
    .inactive-alert { background: linear-gradient(135deg, #e74a3b 0%, #be2617 100%); color: white; border: none; }
    .auth-page { padding: 1rem; }
    .auth-card { max-height: calc(100vh - 100px); overflow-y: auto; }
    @media (min-width: 992px) {
      .auth-card { max-height: none; overflow-y: visible; }
    }
  </style>
  <base>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card fade-in">
      <div class="auth-logo">
        <i class="fas fa-folder-open"></i>
        <h3>OQAADMS</h3>
        <p>Office of Quality Assurance & Accreditation Document Management System</p>
      </div>

      <div id="statusMessage" style="display: none;"></div>

      <form class="auth-form" id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-envelope text-muted"></i></span>
            <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-lock text-muted"></i></span>
            <input type="password" class="form-control border-start-0" id="loginPassword" placeholder="Enter your password" required>
            <button type="button" class="input-group-text bg-transparent border-start-0" onclick="togglePassword('loginPassword')">
              <i class="fas fa-eye text-muted" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="text-primary text-decoration-none" onclick="showToast('Reset Password', 'Contact your administrator to reset your password.', 'info')">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3" id="loginBtn">
          <i class="fas fa-sign-in-alt me-2"></i>Sign In
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </div>
  </div>

  <!-- Fixed auth footer bar -->
  <div class="auth-footer-bar">
    <div class="footer-brand"><strong>OQAADMS</strong> &copy; 2026</div>
    <div class="footer-images">
      <img src="static/img/first.png" alt="Partner 1" class="footer-img">
      <img src="static/img/second.jpg" alt="Partner 2" class="footer-img">
      <img src="static/img/third.png" alt="Partner 3" class="footer-img">
      <img src="static/img/fourth.png" alt="Partner 4" class="footer-img">
      <a href="https://facebook.com/share/1FnVMMFf92"><img src="static/img/top.png" alt="Partner 5" class="footer-img"></a>
    </div>
    <div class="footer-social">
          <a href="https://facebook.com/share/1CzyUtYioQ" target="_blank" rel="noopener noreferrer" title="Facebook"><i class="fab fa-facebook"></i></a>
          <a href="mailto:oqaa.office@bsu.edu.ph" class="footer-email" title="Send Email"><i class="fas fa-envelope"></i> oqaa.office@bsu.edu.ph</a>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api.js"></script>
  <script src="script.js"></script>
  <script>
    // ============================================================
    // BACK-BUTTON PROTECTION: Prevent returning to login after auth
    // ============================================================
    (function() {
      // Replace current history entry so back button cannot return to login
      if (window.history.replaceState) {
        window.history.replaceState(null, document.title, window.location.href);
      }
    })();

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById('toggleIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function showStatusMessage(message, type) {
      const statusDiv = document.getElementById('statusMessage');
      const alertClass = type === 'pending' ? 'pending-alert' : type === 'inactive' ? 'inactive-alert' : 'alert-danger';
      const icon = type === 'pending' ? 'fa-clock' : type === 'inactive' ? 'fa-ban' : 'fa-exclamation-circle';
      statusDiv.innerHTML = `<div class="alert ${alertClass} mb-3"><i class="fas ${icon} me-2"></i>${message}</div>`;
      statusDiv.style.display = 'block';
    }

    function hideStatusMessage() {
      document.getElementById('statusMessage').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideStatusMessage();

      const loginBtn = document.getElementById('loginBtn');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Signing in...';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const result = await AuthAPI.login(email, password);
        if (result.success) {
          showToast('Success', `Welcome, ${result.user.name || result.user.email}!`, 'success');
          // Use replaceState to prevent back-button return to login
          setTimeout(() => {
            window.location.replace('home.html');
          }, 800);
        } else {
          if (result.message && result.message.includes('pending approval')) {
            showStatusMessage(result.message, 'pending');
          } else if (result.message && result.message.includes('deactivated')) {
            showStatusMessage(result.message, 'inactive');
          } else {
            showToast('Login Failed', result.message || 'Invalid credentials', 'danger');
          }
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
        }
      } catch (err) {
        console.error(err);
        showToast('Error', 'Cannot connect to server. Please ensure the server is running.', 'danger');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Sign In';
      }
    });

    // Check if already logged in and redirect immediately
    async function checkAuthAndRedirect() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.id) {
            window.location.replace('home.html');
          }
        }
      } catch (e) {}
    }

    // Handle browser back-button returning to login after auth (bfcache)
    window.addEventListener('pageshow', function(event) {
      if (event.persisted) {
        checkAuthAndRedirect();
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuthAndRedirect();
    });
  </script>
</body>
</html>
